<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baixando seu livro... — NeuroJogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: #F5EFE6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.1);
    }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 900; color: #1E2A38; margin-bottom: 0.75rem; }
    p { color: rgba(30,42,56,0.6); font-weight: 600; font-size: 0.95rem; line-height: 1.6; }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      background: #C46A4A;
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.875rem 2rem;
      border-radius: 0.75rem;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(196,106,74,0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📥</div>
    <h1>Seu download começou!</h1>
    <p>Se o download não iniciar automaticamente, clique no botão abaixo.</p>
    <a href="/NBBR.pdf" download class="btn">Baixar PDF agora</a>
  </div>
  <script>
    // Auto-download
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = '/NBBR.pdf';
      a.download = 'NeuroJogo.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, 500);
  </script>
</body>
</html>
